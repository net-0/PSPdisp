# modprobe.conf - Options of the EVDI kernel module for the PSPdisp daemon (Linux)
#
# Copyright © 2026 Arthur Neto
#
# The module creates a device when it loads, so the daemon doesn't ask for the password (through polkit) to create the first one, as only root can.
# It still asks when no device is free (e.g. a DisplayLink dock took it), to create another one.
# Installed by the installers as /usr/lib/modprobe.d/00-pspdisp.conf: named to be read before the others, so a bigger count set elsewhere wins (e.g. in /etc/modprobe.d/evdi.conf).

options evdi initial_device_count=1
